<style>
  :root {
    --bg: #fff8f2;
    --surface: #ffffff;
    --primary: #ff7a4d;
    --primary-dark: #e8603a;
    --secondary: #4d8dff;
    --text: #2b2320;
    --text-light: #6b6058;
    --border: #f0e0d4;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 28px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .top-bar { display: flex; align-items: center; justify-content: space-between; }
  .top-bar .title { font-size: 1.15rem; font-weight: 800; color: var(--primary-dark); }

  .ad-slot {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px dashed #ffd9c2;
    border-radius: 12px;
    background: #fffaf6;
    color: var(--text-light);
    font-size: 0.78rem;
    line-height: 1.4;
    padding: 6px;
  }
  .ad-slot.banner { min-height: 50px; max-width: 320px; margin: 0 auto; }
  .ad-slot.rectangle { min-height: 250px; max-width: 300px; margin: 10px auto 0; display: none; }

  .game-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 6px 18px rgba(43, 35, 32, 0.10);
    padding: 22px 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  #screen-start { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  #screen-start .emoji-big { font-size: 3.2rem; }
  #screen-start h1 { font-size: 1.35rem; margin: 0; }
  #screen-start p { color: var(--text-light); font-size: 0.9rem; margin: 0; line-height: 1.6; }

  .topic-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    margin-top: 4px;
  }
  .topic-btn {
    background: #fff1e8;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .topic-btn:active { background: var(--primary); }
  .topic-btn:active .topic-label, .topic-btn:active .topic-emoji { color: #fff; }
  .topic-btn .topic-emoji { font-size: 1.8rem; }
  .topic-btn .topic-label { font-weight: 800; font-size: 0.95rem; color: var(--primary-dark); }
  .topic-btn.wide { grid-column: 1 / 3; }
  .topic-best { font-size: 0.7rem; color: var(--text-light); margin-top: 2px; }

  #screen-play { gap: 12px; }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff1e8;
    border-radius: 14px;
    padding: 10px 16px;
  }
  .hud .stat { text-align: center; }
  .hud .stat .num { font-size: 1.25rem; font-weight: 800; color: var(--primary-dark); }
  .hud .stat .label { font-size: 0.7rem; color: var(--text-light); font-weight: 700; }

  .chosung-category {
    display: inline-block;
    background: #fff1e8;
    color: var(--primary-dark);
    font-size: 0.85rem;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
    margin: 0 auto;
  }

  .chosung-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .chosung-hint {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 8px;
    color: var(--text);
    word-break: keep-all;
    text-align: center;
  }

  .chosung-answer {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--primary-dark);
    background: #fff8f2;
    border: 2px dashed #ffd9c2;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }

  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-size: 1.02rem;
    touch-action: manipulation;
  }
  .btn:active { background: var(--primary-dark); transform: scale(0.98); }
  .btn.secondary { background: #fff; color: var(--primary-dark); border: 2px solid var(--primary); }

  #screen-result { align-items: center; justify-content: center; text-align: center; gap: 8px; }
  #screen-result .emoji-big { font-size: 3rem; }
  #screen-result h2 { margin: 4px 0 0; font-size: 1.25rem; }
  #result-score { font-size: 2rem; font-weight: 800; color: var(--primary-dark); margin: 2px 0; }
  #result-best { font-size: 0.85rem; color: var(--text-light); }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

  .share-section { margin-top: 10px; width: 100%; }
  .share-label { font-size: 0.82rem; color: var(--text-light); margin-bottom: 10px; }
  .share-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .share-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; border-radius: 999px; padding: 11px 18px;
    font-weight: 700; font-size: 0.9rem; cursor: pointer;
    touch-action: manipulation; font-family: inherit;
  }
  .share-btn.kakao { background: #fee500; color: #3c1e1e; }
  .share-btn.native { background: var(--secondary); color: #fff; }
  .share-btn.small { padding: 8px 14px; font-size: 0.82rem; background: #f5f0eb; color: var(--text); }
  .share-btn:active { transform: scale(0.96); }

  .share-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #2b2320; color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 0.85rem; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; z-index: 999; white-space: nowrap;
  }
  .share-toast.show { opacity: 1; }

  .foot-note { text-align: center; font-size: 0.78rem; color: var(--text-light); }
  .foot-note a { color: var(--secondary); text-decoration: none; }
</style>
</head>

    </div>

      <div class="emoji-big">🎉</div>

        <button class="btn secondary" id="btn-change-topic">다른 주제 선택</button>
      </div>

      <div class="share-section">
        <div class="share-label">친구에게 도전장을 내밀어보세요!</div>
        <div class="share-row">
          <button class="share-btn native" id="btn-share-native">📤 공유하기</button>
        </div>
      </div>
    </div>
  </div>

    result: document.getElementById("screen-result")
  };
  var adResult = document.getElementById("ad-result");
  var hudProgress = document.getElementById("hud-progress");
  var hudTopic = document.getElementById("hud-topic");
  var chosungCat = document.getElementById("chosung-cat");
  var chosungHint = document.getElementById("chosung-hint");
  var chosungAnswer = document.getElementById("chosung-answer");
  var btnReveal = document.getElementById("btn-reveal");
  var btnNext = document.getElementById("btn-next");
  var resultScore = document.getElementById("result-score");
  var resultBest = document.getElementById("result-best");

  var currentTopic = "brand";
  var roundWords = [];
  var pos = 0;
  var revealedCount = 0;

  function showScreen(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].classList.toggle("active", key === name);
    });
    adResult.style.display = (name === "result") ? "flex" : "none";
  }

  function renderBestScores() {
    document.querySelectorAll(".topic-best").forEach(function (el) {
      var topic = el.getAttribute("data-best");
      el.textContent = "최고 " + getBest(topic) + "개";
    });
  }

  function renderQuestion() {
    if (pos >= roundWords.length) { finishRound(); return; }
    var word = roundWords[pos];
    hudProgress.textContent = (pos + 1) + " / " + roundWords.length;
    hudTopic.textContent = TOPIC_LABEL[currentTopic];
    chosungCat.textContent = TOPIC_LABEL[currentTopic];
    chosungHint.textContent = getChosung(word);
    chosungAnswer.style.display = "none";
    chosungAnswer.textContent = "정답: " + word;
    btnReveal.style.display = "inline-block";
    btnNext.style.display = "none";
  }

  function startTopic(topic) {
    currentTopic = topic;
    roundWords = shuffle(WORDS[topic]).slice(0, ROUND_SIZE);
    pos = 0;
    revealedCount = 0;
    showScreen("play");
    renderQuestion();
  }

  function finishRound() {
    var best = getBest(currentTopic);
    var isNewBest = revealedCount > best;
    if (isNewBest) setBest(currentTopic, revealedCount);
    resultScore.textContent = revealedCount + " / " + roundWords.length + "개 확인";
    resultBest.textContent = "최고 기록: " + (isNewBest ? revealedCount : best) + "개" + (isNewBest ? " · 신기록! 🏆" : "");
    renderBestScores();
    showScreen("result");
  }

  document.querySelectorAll(".topic-btn").forEach(function (btn) {
    btn.addEventListener("click", function () { startTopic(btn.getAttribute("data-topic")); });
  });

  btnReveal.addEventListener("click", function () {
    chosungAnswer.style.display = "block";
    btnReveal.style.display = "none";
    btnNext.style.display = "inline-block";
    revealedCount++;
  });
  btnNext.addEventListener("click", function () {
    pos++;
    renderQuestion();
  });
  document.getElementById("btn-again").addEventListener("click", function () { startTopic(currentTopic); });
  document.getElementById("btn-change-topic").addEventListener("click", function () {
    renderBestScores();
    showScreen("start");
  });

  renderBestScores();

  /* ===================== 공유 기능 ===================== */
  var shareToast = document.getElementById("share-toast");
  var toastTimeoutId = null;

  function showToast(msg) {
    shareToast.textContent = msg;
    shareToast.classList.add("show");
    clearTimeout(toastTimeoutId);
    toastTimeoutId = setTimeout(function () { shareToast.classList.remove("show"); }, 1800);
  }

  function getShareText() {
    return "🔤 초성퀴즈 [" + TOPIC_LABEL[currentTopic] + "] 주제에서 " + revealedCount + "개 확인했어요! 너도 도전해볼래?";
  }
  function getShareUrl() { return window.location.href.split("#")[0].split("?")[0]; }

  function fallbackCopy(text, message) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); showToast(message || "링크가 복사되었어요!"); }
    catch (e) { showToast("복사에 실패했어요."); }
    document.body.removeChild(ta);
  }

  function copyLink(message) {
    var url = getShareUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast(message || "링크가 복사되었어요!"); })
        .catch(function () { fallbackCopy(url, message); });
    } else {
      fallbackCopy(url, message);
    }
  }

  function shareResult() {
    if (navigator.share) {
      navigator.share({ title: "초성퀴즈", text: getShareText(), url: getShareUrl() }).catch(function () { });
    } else {
      copyLink("링크가 복사됐어요! 친구에게 공유해보세요.");
    }
  }

  document.getElementById("btn-share-native").addEventListener("click", shareResult);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<title>🧠 기억력 게임 | 시간순삭 미니게임</title>
<meta name="description" content="점점 길어지는 순서를 기억해서 그대로 따라 누르는 기억력 게임. 몇 단계까지 갈 수 있는지 친구와 겨뤄보세요.">
<meta property="og:title" content="🧠 기억력 게임 | 시간순삭">
<meta property="og:description" content="점점 길어지는 순서를 기억해서 따라 누르는 게임! 너는 몇 단계까지 갈 수 있어?">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #fff8f2;
    --surface: #ffffff;
    --primary: #ff7a4d;
    --primary-dark: #e8603a;
    --secondary: #4d8dff;
    --text: #2b2320;
    --text-light: #6b6058;
    --border: #f0e0d4;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 28px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .top-bar { display: flex; align-items: center; justify-content: space-between; }
  .top-bar .title { font-size: 1.15rem; font-weight: 800; color: var(--primary-dark); }

  .ad-slot {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px dashed #ffd9c2;
    border-radius: 12px;
    background: #fffaf6;
    color: var(--text-light);
    font-size: 0.78rem;
    line-height: 1.4;
    padding: 6px;
  }
  .ad-slot.banner { min-height: 50px; max-width: 320px; margin: 0 auto; }
  .ad-slot.rectangle { min-height: 250px; max-width: 300px; margin: 10px auto 0; display: none; }

  .game-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 6px 18px rgba(43, 35, 32, 0.10);
    padding: 22px 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  #screen-start { align-items: center; justify-content: center; text-align: center; gap: 12px; }
  #screen-start .emoji-big { font-size: 3.4rem; }
  #screen-start h1 { font-size: 1.4rem; margin: 0; }
  #screen-start p { color: var(--text-light); font-size: 0.92rem; margin: 0; line-height: 1.6; }
  .best-score { font-size: 0.9rem; color: var(--text-light); font-weight: 700; }

  #screen-play { align-items: center; justify-content: center; gap: 16px; }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff1e8;
    border-radius: 14px;
    padding: 10px 18px;
    width: 100%;
  }
  .hud .stat { text-align: center; }
  .hud .stat .num { font-size: 1.4rem; font-weight: 800; color: var(--primary-dark); }
  .hud .stat .label { font-size: 0.7rem; color: var(--text-light); font-weight: 700; }

  .status-text {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    min-height: 1.4em;
    text-align: center;
  }

  .memory-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 300px;
  }

  .memory-tile {
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    opacity: 0.5;
    transition: opacity 0.1s ease, transform 0.08s ease;
  }
  .memory-tile:active { transform: scale(0.95); }
  .memory-tile.active { opacity: 1; box-shadow: 0 0 26px currentColor; }
  .memory-tile.tile-0 { background: #ff5c5c; color: #ff5c5c; }
  .memory-tile.tile-1 { background: #4d8dff; color: #4d8dff; }
  .memory-tile.tile-2 { background: #34c759; color: #34c759; }
  .memory-tile.tile-3 { background: #ffd23f; color: #ffd23f; }

  #screen-result { align-items: center; justify-content: center; text-align: center; gap: 8px; }
  #screen-result .emoji-big { font-size: 3rem; }
  #screen-result h2 { margin: 4px 0 0; font-size: 1.3rem; }
  #result-score { font-size: 2.2rem; font-weight: 800; color: var(--primary-dark); margin: 2px 0; }
  #result-tier { font-size: 0.98rem; color: var(--text); font-weight: 700; }
  #result-best { font-size: 0.85rem; color: var(--text-light); }

  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    touch-action: manipulation;
  }
  .btn:active { background: var(--primary-dark); transform: scale(0.98); }

  .share-section { margin-top: 14px; width: 100%; }
  .share-label { font-size: 0.82rem; color: var(--text-light); margin-bottom: 10px; }
  .share-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .share-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; border-radius: 999px; padding: 11px 18px;
    font-weight: 700; font-size: 0.9rem; cursor: pointer;
    touch-action: manipulation; font-family: inherit;
  }
  .share-btn.kakao { background: #fee500; color: #3c1e1e; }
  .share-btn.native { background: var(--secondary); color: #fff; }
  .share-btn.small { padding: 8px 14px; font-size: 0.82rem; background: #f5f0eb; color: var(--text); }
  .share-btn:active { transform: scale(0.96); }

  .share-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #2b2320; color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 0.85rem; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; z-index: 999; white-space: nowrap;
  }
  .share-toast.show { opacity: 1; }

  .foot-note { text-align: center; font-size: 0.78rem; color: var(--text-light); }
  .foot-note a { color: var(--secondary); text-decoration: none; }
</style>
</head>
<body>

<div class="game-shell">
  <div class="top-bar">
    <div class="title">🧠 기억력 게임</div>
  </div>

  <!-- 광고 영역 1: 상단 배너 -->
  <div class="ad-slot banner">광고 영역 (배너, 320x50)</div>

  <div class="game-card">
    <div id="screen-start" class="screen active">
      <div class="emoji-big">🧠</div>
      <h1>기억력 게임</h1>
      <p>타일이 켜지는 순서를 잘 보고<br>그대로 따라 눌러보세요.<br>순서는 점점 길어져요!</p>
      <div class="best-score">최고 기록: <span id="best-score-display">0</span>단계</div>
      <button class="btn" id="btn-start">게임 시작</button>
    </div>

    <div id="screen-play" class="screen">
      <div class="hud">
        <div class="stat"><div class="num" id="hud-round">0</div><div class="label">현재 단계</div></div>
        <div class="stat"><div class="num" id="hud-best">0</div><div class="label">최고 기록</div></div>
      </div>
      <div class="status-text" id="status-text">준비하세요!</div>
      <div class="memory-grid" id="memory-grid">
        <button class="memory-tile tile-0" data-tile="0"></button>
        <button class="memory-tile tile-1" data-tile="1"></button>
        <button class="memory-tile tile-2" data-tile="2"></button>
        <button class="memory-tile tile-3" data-tile="3"></button>
      </div>
    </div>

    <div id="screen-result" class="screen">
      <div class="emoji-big">🎉</div>
      <h2>게임 종료!</h2>
      <div id="result-score">0단계</div>
      <div id="result-tier"></div>
      <div id="result-best"></div>
      <button class="btn" id="btn-restart">다시 하기</button>

      <div class="share-section">
        <div class="share-label">기록을 친구에게 자랑해보세요!</div>
        <div class="share-row">
          <button class="share-btn native" id="btn-share-native">📤 공유하기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 광고 영역 2: 결과 화면 사각형 배너 -->
  <div class="ad-slot rectangle" id="ad-result">광고 영역 (사각형, 300x250)</div>

  <p class="foot-note">⏱️ 시간순삭의 미니게임 &middot; <a href="index.html">다른 콘텐츠 보러 가기</a></p>
</div>

<div class="share-toast" id="share-toast"></div>

<script>
(function () {
  var BEST_KEY = "memorygame_best_score";
  var TILE_FREQ = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5

  var screens = {
    start: document.getElementById("screen-start"),
    play: document.getElementById("screen-play"),
    result: document.getElementById("screen-result")
  };
  var adResult = document.getElementById("ad-result");
  var bestScoreDisplay = document.getElementById("best-score-display");
  var hudRound = document.getElementById("hud-round");
  var hudBest = document.getElementById("hud-best");
  var statusText = document.getElementById("status-text");
  var tiles = document.querySelectorAll(".memory-tile");
  var resultScore = document.getElementById("result-score");
  var resultTier = document.getElementById("result-tier");
  var resultBest = document.getElementById("result-best");

  var sequence = [];
  var inputIndex = 0;
  var inputLocked = true;
  var playing = false;
  var audioCtx = null;

  function showScreen(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].classList.toggle("active", key === name);
    });
    adResult.style.display = (name === "result") ? "flex" : "none";
  }

  function getBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function setBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 저장 실패 시 무시 */ }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 미지원 브라우저 무시 */ }
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    } catch (e) { audioCtx = null; }
    return audioCtx;
  }

  function playTone(freq, duration) {
    var ctx = ensureAudio();
    if (!ctx) return;
    try {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration / 1000);
    } catch (e) { /* 오디오 재생 실패 시 무시 */ }
  }

  function flashTile(index, duration) {
    var el = tiles[index];
    el.classList.add("active");
    playTone(TILE_FREQ[index], duration);
    setTimeout(function () { el.classList.remove("active"); }, duration);
  }

  function playSequence() {
    inputLocked = true;
    inputIndex = 0;
    statusText.textContent = "순서를 잘 보세요!";
    var flashDur = Math.max(220, 500 - sequence.length * 12);
    var gap = Math.max(140, 280 - sequence.length * 8);
    var i = 0;
    function step() {
      if (i >= sequence.length) {
        inputLocked = false;
        statusText.textContent = "이제 따라 눌러보세요!";
        return;
      }
      flashTile(sequence[i], flashDur);
      i++;
      setTimeout(step, flashDur + gap);
    }
    setTimeout(step, 500);
  }

  function nextRound() {
    sequence.push(Math.floor(Math.random() * 4));
    hudRound.textContent = String(sequence.length);
    playSequence();
  }

  function handleTileTap(index) {
    if (!playing || inputLocked) return;
    flashTile(index, 180);
    vibrate(10);

    if (sequence[inputIndex] === index) {
      inputIndex++;
      if (inputIndex === sequence.length) {
        inputLocked = true;
        statusText.textContent = "정답! 다음 단계 준비 중...";
        setTimeout(nextRound, 700);
      }
    } else {
      endGame();
    }
  }

  function endGame() {
    playing = false;
    inputLocked = true;
    var score = sequence.length - 1;
    var best = getBest();
    var isNewBest = score > best;
    if (isNewBest) setBest(score);

    var tier;
    if (score < 5) tier = "다음엔 더 잘할 수 있어요! 💪";
    else if (score < 10) tier = "괜찮은 기억력이에요! 👍";
    else if (score < 15) tier = "기억력 대박! 🔥";
    else tier = "천재적인 기억력! 🧠👑";

    resultScore.textContent = score + "단계";
    resultTier.textContent = tier + (isNewBest ? " · 신기록! 🏆" : "");
    resultBest.textContent = "최고 기록: " + (isNewBest ? score : best) + "단계";

    showScreen("result");
  }

  function startGame() {
    sequence = [];
    inputIndex = 0;
    playing = true;
    hudBest.textContent = String(getBest());
    hudRound.textContent = "0";
    showScreen("play");
    nextRound();
  }

  document.getElementById("btn-start").addEventListener("click", startGame);
  document.getElementById("btn-restart").addEventListener("click", startGame);
  tiles.forEach(function (tile) {
    tile.addEventListener("click", function () {
      handleTileTap(parseInt(tile.getAttribute("data-tile"), 10));
    });
  });

  bestScoreDisplay.textContent = getBest();

  /* ===================== 공유 기능 ===================== */
  var shareToast = document.getElementById("share-toast");
  var toastTimeoutId = null;

  function showToast(msg) {
    shareToast.textContent = msg;
    shareToast.classList.add("show");
    clearTimeout(toastTimeoutId);
    toastTimeoutId = setTimeout(function () { shareToast.classList.remove("show"); }, 1800);
  }

  function getShareText() {
    return "🧠 기억력 게임에서 " + (sequence.length - 1) + "단계까지 성공했어요! 너도 도전해볼래?";
  }
  function getShareUrl() { return window.location.href.split("#")[0]; }

  function fallbackCopy(text, message) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); showToast(message || "링크가 복사되었어요!"); }
    catch (e) { showToast("복사에 실패했어요."); }
    document.body.removeChild(ta);
  }

  function copyLink(message) {
    var url = getShareUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast(message || "링크가 복사되었어요!"); })
        .catch(function () { fallbackCopy(url, message); });
    } else {
      fallbackCopy(url, message);
    }
  }

  function shareResult() {
    if (navigator.share) {
      navigator.share({ title: "기억력 게임", text: getShareText(), url: getShareUrl() }).catch(function () { });
    } else {
      copyLink("링크가 복사됐어요! 친구에게 공유해보세요.");
    }
  }

  document.getElementById("btn-share-native").addEventListener("click", shareResult);
})();
</script>
</body>
</html>
